services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webhook_demo
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  webhook-service:
    build:
      context: ./webhook-service
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      FAKE_EVENT_PROCESSOR_ENABLED: "true"
      WEBHOOK_HTTP_TIMEOUT_MS: "2000"
      WEBHOOK_RETRY_MAX_ATTEMPTS: "3"
      WEBHOOK_RETRY_INITIAL_DELAY_MS: "500"
      WEBHOOK_RETRY_BACKOFF_MS: "1000"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_demo
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook

  webhook-client-a:
    build:
      context: ./webhook-client
      dockerfile: Dockerfile
    depends_on:
      - webhook-service
    ports:
      - "18081:8081"
    environment:
      SERVER_PORT: 8081
      CLIENT_NAME: client-a
      CLIENT_BEHAVIOR: SUCCESS
      CALLBACK_URL: http://webhook-client-a:8081/webhooks/notifications
      WEBHOOK_SERVICE_URL: http://webhook-service:8080
      EVENT_TYPES: EVENT_COMPLETED

  webhook-client-b:
    build:
      context: ./webhook-client
      dockerfile: Dockerfile
    depends_on:
      - webhook-service
    ports:
      - "18082:8081"
    environment:
      SERVER_PORT: 8081
      CLIENT_NAME: client-b
      CLIENT_BEHAVIOR: RANDOM_500
      CALLBACK_URL: http://webhook-client-b:8081/webhooks/notifications
      WEBHOOK_SERVICE_URL: http://webhook-service:8080
      EVENT_TYPES: EVENT_COMPLETED

  webhook-client-c:
    build:
      context: ./webhook-client
      dockerfile: Dockerfile
    depends_on:
      - webhook-service
    ports:
      - "18083:8081"
    environment:
      SERVER_PORT: 8081
      CLIENT_NAME: client-c
      CLIENT_BEHAVIOR: TIMEOUT
      CALLBACK_URL: http://webhook-client-c:8081/webhooks/notifications
      WEBHOOK_SERVICE_URL: http://webhook-service:8080
      EVENT_TYPES: EVENT_COMPLETED

volumes:
  postgres_data:
